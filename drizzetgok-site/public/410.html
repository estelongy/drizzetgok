<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sayfa kaldırıldı — Dr. İzzet Gök</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box { max-width: 480px; text-align: center; }
    .code { font-size: 18px; font-weight: 600; color: #059669; letter-spacing: 0.05em; }
    h1 { font-size: 28px; font-weight: 700; margin: 16px 0 12px; line-height: 1.2; }
    p { font-size: 17px; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
    a {
      display: inline-block;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      background: #059669;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">410 — Sayfa kaldırıldı</div>
    <h1>Bu sayfa artık yayında değil</h1>
    <p>Aradığınız sayfa kalıcı olarak kaldırılmıştır. Güncel hizmetler ve içerikler için ana sayfamızı ziyaret edebilirsiniz.</p>
    <a href="/">Ana sayfaya dön</a>
  </div>
</body>
</html>
